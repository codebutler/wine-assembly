<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed in</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #008080;
    font: 13px Arial, sans-serif; color: #000; padding: 16px; box-sizing: border-box; }
  .card { width: min(360px, 100%); padding: 12px; background: #c0c0c0; border: 2px outset #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,.5); box-sizing: border-box; }
  .card b { display: block; margin-bottom: 4px; }
</style>
<!-- Where the LAN sign-in popup lands (lib/browser-shell.js openSignInPopup).
     Berrry's app server has already turned ?token= into the session cookie
     and reloaded this page without it, so all that is left is telling the
     game's tab, which cannot see this window (COOP), and closing. -->
<div class="card"><b>Signed in</b>You can close this window and go back to the game.</div>
<script>
  try { new BroadcastChannel('wine-lan-signin').postMessage({ type: 'signed-in' }); } catch (_) {}
  try { localStorage.setItem('wine-lan-signin-done', String(Date.now())); } catch (_) {}
  setTimeout(() => { try { window.close(); } catch (_) {} }, 300);
</script>
