<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ToyVM · DOS corpus</title>
  <link rel="stylesheet" href="/toyvm/live.css">
  <script src="/toyvm/live.js" defer></script>
</head>
<body>
  <main id="toyvm-app">
    <nav><a id="back" href="/#dos">← DOS / ToyVM corpus</a></nav>
    <header>
      <h1 id="title">Loading…</h1>
      <span id="pill" class="pill"></span>
    </header>
    <p class="sub">Entry program <code id="entry"></code></p>
    <p id="verdict"></p>
    <p id="size" class="sub"></p>
    <div class="actions">
      <button id="start" class="primary" hidden>Start ToyVM session</button>
      <button id="stop" hidden>Stop</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="error" class="error" hidden role="alert">
      <p id="error-text"></p>
      <button id="retry">Retry</button> <a href="/#dos">Back to the dashboard</a>
    </section>
    <section id="stage" hidden>
      <canvas id="screen" tabindex="0" aria-label="ToyVM screen. Click or focus it, then use the keyboard."></canvas>
      <p class="sub">Keyboard only: a browser session gets no mouse. Click the screen before typing.</p>
    </section>
    <div id="details"></div>
  </main>
  <dialog id="loading" aria-labelledby="phase-label">
    <p id="phase-label">Starting…</p>
    <progress id="phase-bar" max="100" hidden></progress>
    <p id="phase-detail" class="sub"></p>
    <button id="cancel">Cancel</button>
  </dialog>
</body>
</html>
