# Wine-Assembly override for GOG's bundled Windows DOSBox 0.74-2.1.
# Keep the nested x86 dynamic recompiler enabled while avoiding host-specific
# fullscreen, audio, and joystick paths. Original GOG save overlay retained.

[sdl]
fullscreen=false
output=surface
autolock=false

[render]
aspect=false
scaler=none

[cpu]
core=dynamic
cycles=fixed 50000

[mixer]
nosound=true

[joystick]
joysticktype=none

[ipx]
ipx=false

[autoexec]
@ECHO OFF
mount C C:\
mount C C:\cloud_saves -t overlay
mount D C:\ -t cdrom
C:
@SET ARENADATA=C:
D:
ACD -Ssbpdig.adv -IOS220 -IRQS7 -DMAS1 -Mgenmidi.adv -IOM330 -IRQM2 -DMAM1
